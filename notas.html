<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar - Notas</title>
</head>

<body>

    <div class="container">

        <div class="topo">
            <h1>Minhas Notas</h1>
            <p>Edite suas notas e veja sua média</p>
        </div>

        <div id="mensagem"></div>

        <div class="notas-container">

            <div class="materia">
                <div>
                    <h2>Matemática</h2>
                    <p>Digite uma nota de 0 a 10</p>
                </div>

                <input type="number" class="nota" value="8.5" min="0" max="10" step="0.1" oninput="calcularMedia(this)">
            </div>

            <div class="materia">
                <div>
                    <h2>Português</h2>
                    <p>Digite uma nota de 0 a 10</p>
                </div>

                <input type="number" class="nota" value="7" min="0" max="10" step="0.1" oninput="calcularMedia(this)">
            </div>

            <div class="materia">
                <div>
                    <h2>Back-End</h2>
                    <p>Digite uma nota de 0 a 10</p>
                </div>

                <input type="number" class="nota" value="9" min="0" max="10" step="0.1" oninput="calcularMedia(this)">
            </div>

            <div class="materia">
                <div>
                    <h2>Banco de Dados</h2>
                    <p>Digite uma nota de 0 a 10</p>
                </div>

                <input type="number" class="nota" value="6.5" min="0" max="10" step="0.1" oninput="calcularMedia(this)">
            </div>

        </div>

        <div class="resultado">
            <h2>Resultado</h2>

            <p>
                Média geral:
                <strong id="media">0,00</strong>
            </p>

            <p id="situacao"></p>
        </div>

        <a href="inicio.html" class="voltar">← Voltar para o início</a>

    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #1e3a8a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 600px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .topo {
            text-align: center;
            margin-bottom: 30px;
        }

        .topo h1 {
            color: #1e3a8a;
            font-size: 30px;
        }

        .topo p {
            color: #666;
            margin-top: 7px;
        }

        .notas-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .materia {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .materia h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
        }

        .materia p {
            color: #666;
            font-size: 13px;
        }

        .nota {
            width: 90px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 17px;
            text-align: center;
            outline: none;
        }

        .nota:focus {
            border-color: #1e3a8a;
        }

        .resultado {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            text-align: center;
        }

        .resultado h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .resultado p {
            color: #555;
            margin-top: 8px;
        }

        #media {
            color: #1e3a8a;
            font-size: 22px;
        }

        #situacao {
            font-size: 18px;
            font-weight: bold;
        }

        .voltar {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        #mensagem {
            display: none;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
        }

        #mensagem.erro {
            display: block;
            background: #ffe5e5;
            color: #b00020;
            border: 1px solid #ffb3b3;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .container {
                padding: 25px 20px;
            }

            .materia {
                gap: 15px;
            }

            .materia h2 {
                font-size: 16px;
            }

            .nota {
                width: 75px;
            }
        }
    </style>

    <script>
        const camposNotas = document.querySelectorAll(".nota");
        const mediaElemento = document.getElementById("media");
        const situacaoElemento = document.getElementById("situacao");
        const mensagem = document.getElementById("mensagem");

        function calcularMedia(campoAlterado) {
            let valor = Number(campoAlterado.value);

            if (valor < 0) {
                mostrarErro("A nota não pode ser menor que 0.");
                campoAlterado.value = 0;
            }

            if (valor > 10) {
                mostrarErro("A nota não pode ser maior que 10.");
                campoAlterado.value = 10;
            }

            let soma = 0;

            camposNotas.forEach(function(campo) {
                soma += Number(campo.value);
            });

            const media = soma / camposNotas.length;

            mediaElemento.textContent = media.toFixed(2).replace(".", ",");

            if (media >= 6) {
                situacaoElemento.textContent = "APROVADO";
                situacaoElemento.style.color = "#15803d";
            } else {
                situacaoElemento.textContent = "REPROVADO";
                situacaoElemento.style.color = "#dc2626";
            }
        }

        function mostrarErro(texto) {
            mensagem.textContent = texto;
            mensagem.className = "erro";

            setTimeout(function() {
                mensagem.className = "";
                mensagem.textContent = "";
            }, 2500);
        }

        calcularMedia(camposNotas[0]);
    </script>

</body>

</html>
